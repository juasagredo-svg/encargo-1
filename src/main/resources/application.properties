spring.application.name=galiana.proyect
spring.datasource.url=jdbc:postgresql://db:5432/postgres
spring.datasource.username=root
spring.datasource.password=root
server.address=0.0.0.0
server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#change profile dev/test
# spring.profiles.active=dev

#swagger things
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# URL PAGINA SWAGER = localhost:8080/doc/swagger-ui.html
# Habilitar métricas
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Configuración de exportación a CloudWatch
management.metrics.export.cloudwatch.namespace=GalianaProject
management.metrics.export.cloudwatch.batch-size=20
management.metrics.export.cloudwatch.step=1m

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Configuracion para los logs
# Configuración de logs
logging.file.name=logs/galiana.log
logging.level.root=INFO
logging.level.org.springframework=INFO


